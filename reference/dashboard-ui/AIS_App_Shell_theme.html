<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIS · Step 7 · App shell, Home, Task List & Notifications</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#F0F3F1;--panel:#FFFFFF;--raise:#F6F8F7;--line:#DAE1DD;--line2:#E8EDEA;--ink:#0F2C24;--text:#1A2A25;--muted:#5A6B65;
--brand:#0A6A4E;--brand-soft:#E1EFE7;--emerald:#0E3A2F;--emerald2:#154A3C;--side-t:#CFE3DA;--side-m:#8DB2A4;--electric:#78FAAE;--e-ink:#06331D;
--amber:#955A00;--amber-soft:#FBEFD6;--red:#B42318;--red-soft:#FCE8E6;--ok:#1B7443;--ok-soft:#E0F2E6;--info:#3047A6;--info-soft:#E6EAFA;--focus:#1F63D1;
--r-s:6px;--r-m:10px;--r-l:16px;--shadow:0 24px 60px -18px rgba(8,32,25,.35);--sideW:252px;
font-family:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1411;--panel:#121D19;--raise:#16231E;--line:#24342E;--line2:#1C2A25;--ink:#E3EEE9;--text:#DAE5E0;--muted:#92A59D;--brand:#6AD7A2;--brand-soft:#16302A;--emerald:#08201A;--emerald2:#0F2D24;--amber:#E6AE52;--amber-soft:#33281A;--red:#F08A80;--red-soft:#3A201D;--ok:#6DCB93;--ok-soft:#173024;--info:#9DB0FF;--info-soft:#1D2440;--shadow:0 24px 60px -18px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{--bg:#0B1411;--panel:#121D19;--raise:#16231E;--line:#24342E;--line2:#1C2A25;--ink:#E3EEE9;--text:#DAE5E0;--muted:#92A59D;--brand:#6AD7A2;--brand-soft:#16302A;--emerald:#08201A;--emerald2:#0F2D24;--amber:#E6AE52;--amber-soft:#33281A;--red:#F08A80;--red-soft:#3A201D;--ok:#6DCB93;--ok-soft:#173024;--info:#9DB0FF;--info-soft:#1D2440;--shadow:0 24px 60px -18px rgba(0,0,0,.7)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
kbd{font:inherit;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted);background:var(--panel)}

/* ---------- App frame ---------- */
.app{display:grid;grid-template-columns:var(--sideW) minmax(0,1fr);min-height:100%;height:100%}
.side{background:var(--emerald);color:var(--side-t);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;padding:18px 12px 12px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--electric);color:var(--e-ink);display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:-.02em}
.brand b{display:block;color:#fff;font-size:16px;letter-spacing:-.01em}
.brand span{display:block;font-size:11.5px;color:var(--side-m)}
.ctx{background:var(--emerald2);border-radius:var(--r-m);padding:10px 10px 8px;margin:0 2px 16px;display:grid;gap:6px}
.ctx label{font-size:11.5px;color:var(--side-m)}
.ctx select{width:100%;background:transparent;border:0;color:#fff;font-weight:600;padding:2px 0;font-size:14px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--side-m) 50%),linear-gradient(135deg,var(--side-m) 50%,transparent 50%);background-position:calc(100% - 9px) 55%,calc(100% - 4px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:18px}
.ctx select:disabled{background-image:none;opacity:1;cursor:default}
.ctx select option{color:#111;background:#fff}
.ctx .ent{font-size:12.5px;color:var(--side-t);font-weight:500}
.nav{display:grid;gap:2px}
.nav h4{font-size:11.5px;font-weight:500;color:var(--side-m);margin:16px 10px 6px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;color:var(--side-t);padding:9px 10px;border-radius:8px;text-align:left;font-weight:500;position:relative}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button[aria-current="page"]{background:rgba(120,250,174,.12);color:#fff}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--electric)}
.nav .lbl{flex:1}
.badge{min-width:22px;height:20px;padding:0 7px;border-radius:10px;font-size:11.5px;font-weight:700;display:inline-grid;place-items:center;background:rgba(255,255,255,.1);color:var(--side-t)}
.badge.hot{background:var(--electric);color:var(--e-ink)}
.side .me{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding:12px 4px 0;display:flex;gap:10px;align-items:center}
.av{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.side .av{background:rgba(255,255,255,.1);color:#fff}
.me .who{flex:1;min-width:0}.me .who b{display:block;color:#fff;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me .who span{font-size:11.5px;color:var(--side-m)}
.me button{border:0;background:none;color:var(--side-m);padding:6px;border-radius:6px}.me button:hover{color:#fff;background:rgba(255,255,255,.07)}
.work{display:flex;flex-direction:column;min-width:0;height:100vh;height:100dvh;overflow-y:auto}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line2)}
.search{flex:1;max-width:560px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;color:var(--muted);text-align:left}
.search:hover{border-color:var(--brand)}.search span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-r{margin-left:auto;display:flex;gap:6px;align-items:center}
.iconbtn{position:relative;border:1px solid transparent;background:none;border-radius:9px;width:38px;height:38px;display:grid;place-items:center;color:var(--text)}
.iconbtn:hover{background:var(--panel);border-color:var(--line)}
.iconbtn .n{position:absolute;top:3px;right:2px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.demo{display:flex;gap:8px;align-items:center;border:1px dashed var(--amber);background:var(--amber-soft);color:var(--amber);border-radius:9px;padding:6px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.demo small{font-weight:500;color:var(--text);opacity:.8}
.envb{font-size:11.5px;font-weight:600;color:var(--amber);padding:3px 8px;border-radius:6px;background:var(--amber-soft)}
.only-m{display:none}
main{min-height:0;flex:1}
main.has-rail{display:grid;grid-template-columns:268px minmax(0,1fr)}
.content{padding:26px 32px 110px;min-width:0;max-width:1320px}
main.has-rail .content{max-width:none}

/* ---------- Typography ---------- */
h1{font-size:26px;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em;color:var(--ink);font-weight:650}
h2{font-size:18px;margin:0;letter-spacing:-.01em;color:var(--ink);font-weight:650}
h3{color:var(--ink)}
.sub{color:var(--muted);max-width:74ch;margin:0}
.small{font-size:12px}
.fine{font-size:12.5px;color:var(--muted);margin:8px 0 0;max-width:70ch}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}

/* ---------- Home ---------- */
.hero{margin:6px 0 22px;max-width:30ch}
.hero .hi{display:block;font-size:15px;color:var(--muted);font-weight:500;margin-bottom:6px;letter-spacing:0}
.hero .say{display:block;font-size:34px;line-height:1.12;font-weight:650;letter-spacing:-.028em;color:var(--ink)}
.digest{display:flex;gap:12px;align-items:flex-start;max-width:720px;margin:-6px 0 28px;padding:12px 14px;border-radius:var(--r-m);background:var(--panel);border:1px solid var(--line)}
.digest .clk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none}
.digest b{color:var(--ink)}
.home-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(290px,1fr);gap:28px;align-items:start}
.home-grid>*,.home-grid>* *{min-width:0}.home-grid .panel{overflow:hidden}
.sec{margin-bottom:30px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 10px}
.sec-h h2 .c{color:var(--muted);font-weight:500;margin-left:6px}
.linkbtn{border:0;background:none;color:var(--brand);font-weight:600;padding:2px 0}
.linkbtn:hover{text-decoration:underline}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);padding:18px}
.panel+.panel{margin-top:16px}
.panel h3{font-size:15px;margin:0 0 4px}
.panel .sub{font-size:13px}
.startbox{background:var(--emerald);color:var(--side-t);border:0}
.startbox h3{color:#fff;font-size:17px}
.startbox p{color:var(--side-t);margin:4px 0 14px;font-size:13px}
.btn-e{border:0;background:var(--electric);color:var(--e-ink);font-weight:700;border-radius:9px;padding:10px 16px;display:inline-flex;gap:8px;align-items:center}
.btn-e:hover{filter:brightness(.96)}
.mini{list-style:none;margin:10px 0 0;padding:0;display:grid}
.mini li{border-top:1px solid var(--line2)}
.mini button{width:100%;border:0;background:none;text-align:left;padding:9px 0;display:flex;gap:10px;align-items:baseline}
.mini button:hover .t{color:var(--brand)}
.mini .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .m{font-size:12px;color:var(--muted);white-space:nowrap}
.bars{display:grid;gap:9px;margin-top:12px}
.bar-r{display:grid;grid-template-columns:minmax(90px,130px) 1fr 30px;gap:10px;align-items:center;font-size:13px}
.bar-r .tr{height:10px;border-radius:5px;background:var(--line2);overflow:hidden}
.bar-r .tr i{display:block;height:100%;border-radius:5px;background:var(--brand)}
.bar-r .tr i.w{background:var(--amber)}.bar-r .tr i.x{background:var(--red)}
.bar-r b{text-align:right;color:var(--ink)}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line2);margin:12px 0 10px;gap:2px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px 3px 8px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.legend button:hover{border-color:var(--brand)}
.legend i{width:9px;height:9px;border-radius:50%}
.legend b{color:var(--ink)}

/* ---------- Status chips (1:1 with Status Model, US-006) ---------- */
.st{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;line-height:1.5}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-n{background:var(--line2);color:var(--muted)}.st-i{background:var(--info-soft);color:var(--info)}.st-p{background:var(--brand-soft);color:var(--brand)}
.st-w{background:var(--amber-soft);color:var(--amber)}.st-o{background:var(--ok-soft);color:var(--ok)}.st-r{background:var(--red-soft);color:var(--red)}
.tone-n{background:var(--muted)}.tone-i{background:var(--info)}.tone-p{background:var(--brand)}.tone-w{background:var(--amber)}.tone-o{background:var(--ok)}.tone-r{background:var(--red)}

/* ---------- Relay track (signature) ---------- */
.track{display:flex;gap:2px;align-items:center;height:12px;min-width:0}
.track i{flex:1;height:4px;border-radius:2px;background:var(--line);min-width:2px}
.track i.d{background:var(--brand);opacity:.55}
.track i.c{height:12px;border-radius:3px;background:var(--electric);box-shadow:0 0 0 1.5px var(--e-ink) inset;flex:1.6}
.track i.x{height:12px;border-radius:3px;background:var(--red);flex:1.6}
.track.done i{background:var(--ok);opacity:.7}

/* ---------- Case rows ---------- */
.rows{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.grp-h{display:flex;align-items:center;gap:8px;padding:10px 16px 8px;font-size:12.5px;font-weight:650;color:var(--muted);background:var(--raise);border-bottom:1px solid var(--line2)}
.grp-h.over{color:var(--red)}.grp-h.today{color:var(--amber)}
.grp-h .ct{font-weight:500}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,210px) 150px;gap:6px 20px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line2);background:none;text-align:left;padding:13px 16px;position:relative}
.row:last-child{border-bottom:0}
.row:hover{background:var(--raise)}
.row:focus-visible{outline-offset:-2px}
.row.mine::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--electric)}
.r-main{min-width:0;display:grid;gap:3px}
.r-id{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.r-id b{color:var(--ink);font-weight:650;letter-spacing:.01em}
.r-topic{font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-step{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;min-width:0}
.r-step .sn{display:inline-grid;place-items:center;min-width:22px;height:18px;border-radius:5px;background:var(--line2);color:var(--ink);font-weight:700;font-size:11px;padding:0 4px}
.r-step span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-tr{display:grid;gap:5px}
.r-tr small{font-size:11.5px;color:var(--muted)}
.r-due{text-align:right;display:grid;gap:2px;justify-items:end}
.r-due b{font-size:13px;font-weight:650;color:var(--ink)}
.r-due b.over{color:var(--red)}.r-due b.today{color:var(--amber)}
.r-due span{font-size:12px;color:var(--muted)}
.empty{padding:34px 22px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.empty .art{width:52px;height:52px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 12px}

/* ---------- Toolbars & filters ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 14px;align-items:center}
.toolbar input[type=search]{min-width:220px;flex:1;max-width:360px}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchips button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.fchips button b{font-weight:700;color:var(--muted)}
.fchips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.fchips button[aria-pressed="true"] b{color:inherit;opacity:.75}
select,input,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
textarea{width:100%;resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}

/* ---------- Buttons (shared with admin) ---------- */
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:8px;font-weight:600;display:inline-flex;gap:7px;align-items:center;justify-content:center}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#07130F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#07130F}}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--red)}.btn.danger:hover{border-color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{padding:12px 18px;font-size:15px}
.proto{font-size:11px;color:var(--amber);background:var(--amber-soft);padding:2px 6px;border-radius:4px}

/* ---------- Drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,22,17,.42);z-index:60;opacity:0;transition:opacity .18s}
.scrim.open{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--panel);z-index:61;box-shadow:var(--shadow);display:flex;flex-direction:column;transform:translateX(24px);opacity:0;transition:transform .2s ease,opacity .2s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none;opacity:1}
.dr-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.dr-h .ttl{flex:1;min-width:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.dr-h .ttl b{color:var(--ink);font-size:14px}
.dr-b{flex:1;overflow-y:auto;overflow-x:hidden;min-width:0;padding:18px 20px 30px}
.dr-b h2.topic{font-size:21px;line-height:1.25;margin-bottom:6px}
.dr-b .meta2{color:var(--muted);font-size:13px;margin:0 0 16px}
.turn{border-radius:var(--r-m);padding:14px 16px;background:var(--raise);border:1px solid var(--line2);margin-bottom:16px}
.turn.mine{background:color-mix(in srgb,var(--electric) 16%,var(--panel));border-color:color-mix(in srgb,var(--electric) 55%,var(--line))}
.turn .who{font-weight:700;color:var(--ink);font-size:15px;margin-bottom:2px}
.turn p{margin:2px 0;font-size:13.5px}
.turn .due-over{color:var(--red);font-weight:650}.turn .due-today{color:var(--amber);font-weight:650}
.actbox{display:grid;gap:10px;margin:0 0 20px}
.actbox label{font-size:12.5px;color:var(--muted);display:grid;gap:5px}
.actrow{display:flex;gap:8px;flex-wrap:wrap}
.blk{margin:22px 0 0}
.blk>h3{font-size:13px;font-weight:650;color:var(--muted);margin:0 0 10px}
.stepper{list-style:none;margin:0;padding:0;position:relative}
.stepper li{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start;padding:6px 0;position:relative}
.stepper li::before{content:"";position:absolute;left:16px;top:26px;bottom:-8px;width:2px;background:var(--line)}
.stepper li:last-child::before{display:none}
.stepper li.d::before{background:var(--brand);opacity:.5}
.stepper .no{width:34px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--panel);border:1.5px solid var(--line);color:var(--muted);position:relative;z-index:1}
.stepper li.d .no{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.stepper li.c .no{background:var(--electric);border-color:var(--e-ink);color:var(--e-ink)}
.stepper li.x .no{background:var(--red);border-color:var(--red);color:#fff}
.stepper .nm{font-size:13.5px;color:var(--text)}.stepper li.c .nm{font-weight:700;color:var(--ink)}
.stepper .nm small{display:block;font-size:12px;color:var(--muted)}
.stepper .dt{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.stepper .gapli{padding:2px 0 2px 44px;font-size:12px;color:var(--muted)}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border:1px solid var(--line2);border-radius:var(--r-m);overflow:hidden}
.dl div{padding:9px 12px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);min-width:0}
.dl dt{font-size:11.5px;color:var(--muted)}.dl dd{margin:1px 0 0;font-weight:550;word-break:break-word;font-size:13.5px}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:0}
.hist li{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line2);font-size:13px}
.hist li:first-child{border-top:0}
.hist .when{color:var(--muted);font-size:12px}
.hist b{color:var(--ink);font-weight:600}
.why{font-size:13px;background:var(--raise);border-radius:var(--r-m);padding:12px 14px;border:1px solid var(--line2)}
.why b{color:var(--ink)}

/* ---------- Notifications ---------- */
.seg2{display:flex;background:var(--line2);border-radius:9px;padding:3px;gap:2px;margin:0 20px 0}
.seg2 button{flex:1;border:0;background:none;border-radius:7px;padding:7px 10px;font-weight:600;font-size:13px;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.nlist{list-style:none;margin:0;padding:0}
.nday{font-size:12px;font-weight:650;color:var(--muted);margin:16px 0 6px}
.nitem{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:10px 10px 10px 8px;border-radius:9px;position:relative;width:100%;text-align:left;border:0;background:none}
.nitem:hover{background:var(--raise)}
.nitem.un{background:color-mix(in srgb,var(--electric) 9%,var(--panel))}
.nitem.un::after{content:"";position:absolute;right:10px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--brand)}
.nk{width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.nk.ALERT{background:var(--brand-soft);color:var(--brand)}.nk.REMINDER{background:var(--amber-soft);color:var(--amber)}.nk.ESCALATION{background:var(--red-soft);color:var(--red)}.nk.CONSOLIDATED_LIST{background:var(--info-soft);color:var(--info)}
.nitem .nt,.nitem .nb,.nitem .nm{display:block}.nitem .nt{font-weight:650;color:var(--ink);font-size:13.5px;padding-right:18px}
.nitem .nb{font-size:13px;color:var(--text);margin-top:1px}
.nitem .nm{font-size:11.5px;color:var(--muted);margin-top:3px}
.mail{border:1px solid var(--line2);border-radius:var(--r-m);padding:12px 14px;margin-bottom:10px}
.mail .mh{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}
.mail b{display:block;color:var(--ink);margin:4px 0}
.mail pre{white-space:pre-wrap;font:inherit;font-size:13px;margin:0;color:var(--text)}

/* ---------- Palette ---------- */
dialog.pal{border:0;padding:0;background:transparent;width:min(640px,94vw);margin-top:10vh;color:var(--text)}
dialog.pal::backdrop{background:rgba(6,22,17,.42)}
.pal-in{background:var(--panel);border-radius:var(--r-l);box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
.pal-q{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line2)}
.pal-q input{border:0;flex:1;font-size:16px;padding:4px 0;background:transparent;box-shadow:none}
.pal-r{max-height:52vh;overflow-y:auto;padding:6px}
.pal-g{font-size:11.5px;color:var(--muted);font-weight:650;padding:10px 10px 4px}
.pal-o{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px}
.pal-o[aria-selected="true"]{background:var(--brand-soft)}
.pal-o .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-o .m{font-size:12px;color:var(--muted);white-space:nowrap}
.pal-f{font-size:12px;color:var(--muted);padding:10px 16px;border-top:1px solid var(--line2);display:flex;gap:14px;flex-wrap:wrap}

/* ---------- Ask AIS ---------- */
.askfab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:40;border:0;border-radius:999px;background:var(--emerald);color:#fff;padding:12px 18px 12px 14px;font-weight:650;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow)}
.askfab svg{color:var(--electric)}
.asklog{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.bub{max-width:92%;min-width:0;overflow-wrap:anywhere;padding:10px 13px;border-radius:14px;font-size:13.5px}
.bub.u{justify-self:end;background:var(--emerald);color:#fff;border-bottom-right-radius:4px}
.bub.a{background:var(--raise);border:1px solid var(--line2);border-bottom-left-radius:4px}
.bub.a .mini{margin-top:6px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.sugg button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px}
.sugg button:hover{border-color:var(--brand);color:var(--brand)}
.askin{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line2)}
.askin input{flex:1}

/* ---------- Launcher (GP step 2) ---------- */
.form{display:grid;gap:14px}
.form label{display:grid;gap:5px;font-size:12.5px;color:var(--muted);font-weight:500}
.form .two{display:grid;grid-template-columns:1fr 130px;gap:10px}
.prefill{display:flex;flex-wrap:wrap;gap:6px}
.prefill span{font-size:12.5px;background:var(--raise);border:1px solid var(--line2);border-radius:6px;padding:4px 8px}
.prefill b{color:var(--ink);font-weight:600}
.route{border-radius:var(--r-m);border:1px solid var(--line);padding:14px;background:var(--raise);display:grid;gap:8px}
.route .fl{font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.route .track{height:14px}.route .track i.c{height:14px}
.err-box{color:var(--red);background:var(--red-soft);border-radius:8px;padding:9px 12px;font-size:13px}

/* ---------- Demo panel ---------- */
.clockface{display:flex;align-items:baseline;gap:12px;margin:6px 0 12px}
.clockface b{font-size:30px;letter-spacing:-.02em;color:var(--ink)}
.personas{display:grid;gap:6px}
.pp{display:flex;gap:10px;align-items:center;border:1px solid var(--line2);background:var(--panel);border-radius:9px;padding:8px 10px;text-align:left;width:100%}
.pp:hover{border-color:var(--brand)}.pp[aria-current="true"]{border-color:var(--brand);background:var(--brand-soft)}
.pp .t{flex:1;min-width:0}.pp .t b{display:block;font-size:13px;color:var(--ink)}.pp .t span{font-size:12px;color:var(--muted)}

/* ---------- Sign-in gate ---------- */
.gate{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:100vh;min-height:100dvh}
.g-brand{background:var(--emerald);color:var(--side-t);padding:48px 56px;display:flex;flex-direction:column;gap:28px;position:relative;overflow:hidden}
.g-brand .brand{padding:0}
.g-claim{font-size:40px;line-height:1.08;letter-spacing:-.03em;color:#fff;font-weight:650;max-width:15ch;margin:auto 0 0}
.g-relay{list-style:none;margin:0;padding:0;display:grid;gap:0;max-width:420px}
.g-relay li{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;padding:9px 0;font-size:14px;color:var(--side-t);position:relative}
.g-relay li::before{content:"";position:absolute;left:10px;top:28px;bottom:-10px;width:2px;background:rgba(255,255,255,.14)}
.g-relay li:last-child::before{display:none}
.g-relay .dot{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.25);position:relative;z-index:1;background:var(--emerald)}
.g-relay li.on .dot{background:var(--electric);border-color:var(--electric);box-shadow:0 0 0 5px rgba(120,250,174,.18)}
.g-relay li.on{color:#fff;font-weight:600}
.g-relay small{color:var(--side-m);font-size:12px}
.g-foot{font-size:12px;color:var(--side-m);margin:0}
.g-panel{display:grid;place-items:center;padding:40px 24px}
.g-card{width:min(460px,100%)}
.g-steps{display:flex;gap:8px;margin-bottom:26px}
.g-steps span{height:4px;flex:1;border-radius:2px;background:var(--line)}
.g-steps span.on{background:var(--brand)}
.g-card h1{font-size:30px}
.g-card .sub{margin-bottom:20px}
.g-btns{display:grid;gap:10px;margin:22px 0 18px}
.g-btns .btn{justify-content:flex-start;padding:13px 16px;font-size:15px;border-radius:11px}
.g-btns .btn small{margin-left:auto;font-weight:500;color:inherit;opacity:.75;font-size:12px}
.idp{border:1px solid var(--line);border-radius:var(--r-l);background:var(--panel);overflow:hidden}
.idp-h{padding:14px 16px;border-bottom:1px solid var(--line2);display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.idp-h b{color:var(--ink)}
.idp-s{padding:10px 12px;border-bottom:1px solid var(--line2)}
.idp-s input{width:100%}
.idp-l{max-height:min(52vh,460px);overflow-y:auto}
.idp-g{font-size:12px;font-weight:650;color:var(--muted);padding:12px 16px 4px}
.acct{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:10px 16px}
.acct:hover,.acct:focus-visible{background:var(--raise)}
.acct .t{flex:1;min-width:0}.acct .t b{display:block;color:var(--ink);font-size:14px}.acct .t span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct .warnr{font-size:11.5px;color:var(--amber);font-weight:600}
.verify{display:grid;gap:12px;margin:24px 0}
.verify div{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px}
.verify div.ok{color:var(--ink)}
.verify .tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.verify div.ok .tick{background:var(--brand);border-color:var(--brand);color:#fff}
.verify div.run .tick{border-color:var(--brand);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rolecards{display:grid;gap:8px;margin-top:16px}
.rolecards button{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:13px 14px;text-align:left}
.rolecards button:hover{border-color:var(--brand)}
.rolecards b{display:block;color:var(--ink)}.rolecards span{font-size:12.5px;color:var(--muted)}

/* ---------- Details disclosure ---------- */
details.disc{margin-top:26px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--panel)}
details.disc summary{cursor:pointer;padding:14px 18px;font-weight:600;color:var(--ink)}
details.disc>div{padding:0 18px 18px}

/* ---------- Legacy admin components, restyled ---------- */
aside.rail{border-right:1px solid var(--line);background:var(--panel);padding:18px 0 40px;overflow-y:auto;max-height:calc(100dvh - 59px);position:sticky;top:59px}
.stage{padding:4px 14px 12px}
.stage h3{font-size:12.5px;margin:10px 0 6px;display:flex;gap:8px;align-items:center;color:var(--ink);font-weight:650}
.stage h3 .n{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:6px;background:var(--emerald);color:#fff;font-size:11px;padding:0 4px}
.stage h3 .hint{font-weight:400;color:var(--muted);font-size:12px}
.stage ul{list-style:none;margin:0 0 0 10px;padding:0 0 0 10px;border-left:2px solid var(--line2)}
.stage li button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;background:none;padding:6px 8px 6px 12px;border-radius:0 7px 7px 0;gap:6px;font-size:13.5px;color:var(--text)}
.stage li button:hover{background:var(--raise)}
.stage li button[aria-current="true"]{background:var(--brand-soft);color:var(--brand);font-weight:650}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px}
.d-seed{background:var(--ok)}.d-client{background:var(--amber)}.d-dir{background:var(--muted)}.d-demo{background:var(--amber);opacity:.55}.d-sample{background:var(--amber);opacity:.55}
.head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--panel);display:inline-block}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.chip.err{background:var(--red-soft);color:var(--red);border-color:transparent;white-space:nowrap}
.gap{border-left:3px solid var(--amber);background:var(--amber-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;max-width:92ch;font-size:13.5px}
.gap b{color:var(--amber)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-m);background:var(--panel)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:top;white-space:nowrap}
td.wrap{white-space:normal;min-width:200px}
th{font-weight:650;font-size:12px;color:var(--muted);background:var(--raise);position:sticky;top:0;cursor:pointer}
tbody tr:hover td{background:var(--raise)}
tr.inactive td{opacity:.5}
tr:last-child td{border-bottom:0}
.act{border:0;background:none;color:var(--brand);font:inherit;font-weight:600;padding:0 4px}
td .act{border:0;background:none;color:var(--brand);padding:0 4px;font-weight:600}
.vis-T{color:var(--brand);font-weight:650}.vis-S{color:var(--muted)}
dialog#dlg{border:1px solid var(--line);border-radius:var(--r-l);padding:0;background:var(--panel);color:var(--text);width:min(580px,94vw);box-shadow:var(--shadow)}
dialog#dlg::backdrop{background:rgba(6,22,17,.45)}
.dlg-h{padding:16px 20px;border-bottom:1px solid var(--line2);font-weight:650;font-size:16px;color:var(--ink)}
.dlg-b{padding:16px 20px;display:grid;gap:12px;max-height:60vh;overflow:auto}
.dlg-b label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.dlg-f{padding:12px 20px;border-top:1px solid var(--line2);display:flex;justify-content:flex-end;gap:8px}
.err-msg{color:var(--red);font-size:13px}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,8px);background:var(--emerald);color:#fff;padding:11px 18px;border-radius:10px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:90;font-weight:500;box-shadow:var(--shadow);max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;max-width:900px}
.grid2 label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.result{margin-top:16px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--panel);padding:16px;max-width:900px}
.result .flow{font-size:20px;font-weight:700;color:var(--brand)}
.steps{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}
.steps span{font-size:12px;padding:2px 7px;border-radius:5px;background:var(--brand-soft);color:var(--brand)}
.readiness{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:16px 0}
.rd{border:1px solid var(--line);border-radius:var(--r-m);padding:14px;background:var(--panel)}
.rd .v{font-size:28px;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.placeholder{max-width:70ch;padding:40px 0}
.rc{display:inline-block;font-size:12px;padding:1px 7px;border-radius:5px;background:var(--brand-soft);color:var(--brand);margin:1px 0}
.grp{font-size:13px;margin:16px 0 6px;color:var(--muted);font-weight:600}
.prof{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r-l);background:var(--panel);max-width:980px;margin-top:16px;overflow:hidden}
.prof div{padding:11px 16px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2)}.prof dt{font-size:12px;color:var(--muted)}.prof dd{margin:2px 0 0;font-weight:550;word-break:break-word}
.qh{margin:22px 0 8px;display:flex;gap:8px;align-items:center}
.seg{display:inline-flex}.seg .btn{border-radius:0}.seg .btn:first-child{border-radius:8px 0 0 8px}.seg .btn:last-child{border-radius:0 8px 8px 0;margin-left:-1px}.seg .btn[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
.treewrap{border:1px solid var(--line);border-radius:var(--r-m);background:var(--panel);padding:10px 14px;overflow-x:auto}
ul.tree,ul.tree ul{list-style:none;margin:0;padding:0}ul.tree ul{margin-left:14px;padding-left:16px;border-left:2px solid var(--line2)}
.ou{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;padding:7px 0}.ou.inactive{opacity:.5}
.ut{font-size:11px;padding:1px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted);min-width:78px;text-align:center}
.ut.t-DEPARTMENT{background:var(--emerald);color:#fff;border-color:var(--emerald)}.ut.t-BA_SECTION{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.on{font-weight:600}.oa .act{font-size:13px}.om{font-size:12px;color:var(--muted)}.oa{margin-left:auto}
ol.chain{margin:10px 0;padding-left:22px;display:grid;gap:8px}ol.chain li b{margin-right:6px}ol.chain li .sub{display:block}
table.hl td{vertical-align:middle}table.hl td.hdep,table.hl td.hchk{white-space:normal;min-width:170px}table.hl td.hchk .chip{display:inline-block;margin:1px 0}tr.hl-stage td{background:var(--raise);font-weight:650;color:var(--ink);padding:12px 12px 8px}
tr.hl-stage .n{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 6px;border-radius:6px;background:var(--emerald);color:#fff;font-size:11px;margin-right:8px}
.act.dep{font-size:12px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin:1px 4px 1px 0}.act.dep-miss{color:var(--amber);background:var(--amber-soft);border-color:transparent}
.pbar{position:relative;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--panel);margin:10px 0 2px;max-width:900px;overflow:hidden}
.pseg{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden}
.pseg.p-on{background:var(--brand);color:var(--panel)}.pseg.p-off{background:repeating-linear-gradient(135deg,var(--brand-soft) 0 6px,var(--panel) 6px 12px);color:var(--brand);border-left:2px solid var(--brand)}
.pscale{position:relative;height:18px;max-width:900px;font-size:11px;color:var(--muted)}.pscale span{position:absolute;transform:translateX(-50%);white-space:nowrap}.pscale span:first-child{transform:none}.pscale span:last-child{transform:translateX(-100%)}

/* ---------- Mobile tab bar ---------- */
.tabbar{display:none}
@media (max-width:1100px){.home-grid{grid-template-columns:1fr}}
@media (max-width:1023px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;left:0;top:0;bottom:0;width:min(290px,86vw);transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--shadow);padding-top:calc(18px + env(safe-area-inset-top,0px))}
 .side.open{transform:none}
 .only-m{display:grid}
 .topbar{padding:10px 14px;top:0}
 .content{padding:20px 16px 120px}
 main.has-rail{grid-template-columns:1fr}
 aside.rail{position:static;max-height:40vh;border-right:0;border-bottom:1px solid var(--line)}
 .search kbd{display:none}
}
@media (max-width:760px){
 .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--panel);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
 .tabbar button{flex:1;border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;position:relative;border-radius:8px}
 .tabbar button[aria-current="page"]{color:var(--brand)}
 .tabbar .tb-n{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--electric);color:var(--e-ink);font-size:10.5px;display:grid;place-items:center;padding:0 4px}
 .askfab{display:none}
 .demo small{display:none}
 .search span{font-size:13px}
 .hero .say{font-size:27px}
 .row{grid-template-columns:minmax(0,1fr);gap:8px;padding:12px 14px}
 .r-tr{order:3}
 .r-due{order:2;text-align:left!important;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
 .envb,#bellBtn{display:none}
 .search{min-width:0}.search span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .topbar{gap:8px}
 .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
 .gate{grid-template-columns:1fr}
 .g-brand{padding:28px 22px 26px;gap:16px}

 .g-relay{display:none}
 .dl{grid-template-columns:1fr}
 .drawer{width:100vw}
 .form .two{grid-template-columns:1fr 110px}

/* ===== Part 5 validation and deactivation guards ===== */
function validateP5(m,rec,row){
 if(m.id==="supplier"){if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(rec.email))return"Email is not a valid address.";
  if(rec.vendor_no){if(!/^[A-Za-z0-9-]{1,20}$/.test(rec.vendor_no))return"Vendor no. is up to 20 letters or digits, for example 3300179408.";if(DB.supplier.some(r=>r!==row&&r.vendor_no&&r.vendor_no.toLowerCase()===rec.vendor_no.toLowerCase()))return`Vendor no. ${rec.vendor_no} already exists (US-031 AC1).`}
  if(rec.mobile&&!/^\+?[0-9][0-9 ]{8,16}$/.test(rec.mobile))return"Mobile is digits with an optional + country code, for example +91 followed by 10 digits.";
  if(rec.source==="Demo"&&!/@demo\.invalid$/i.test(rec.email))return"Demo suppliers use the demo.invalid mail domain so nothing reaches a real inbox.";}
 if(m.id==="restricted"){const n=eclNorm(rec.eclass_code);if(!n||rec.eclass_code.length>20)return"eCl@ss code is up to 20 characters: digits, optionally with hyphens.";
  if(DB.restricted.some(r=>r!==row&&r._active&&r.entity===rec.entity&&eclNorm(r.eclass_code)===n))return`${rec.eclass_code} is already restricted in ${rec.entity} (US-034 AC1).`;
  if(rec.reason_text.length>200)return"Reason is at most 200 characters; it is quoted in the reply to the Buyer.";}
 if(m.id==="phase"){if(!/^P\d$/.test(rec.phase))return"Phase code is P and the phase number: P1, P2.";if(DB.phase.some(r=>r!==row&&r.phase===rec.phase))return`${rec.phase} already exists.`;
  if(+rec.min_inr<0)return"From INR cannot be negative.";if(+rec.max_inr<=+rec.min_inr)return"To INR must be greater than From INR.";if(+rec.max_inr>1000000)return"The bot handles carts up to INR 10 Lacs (1,000,000) only (NB-P14).";
  if(!(Number.isInteger(+rec.min_offers)&&+rec.min_offers>=1))return"Minimum offers is a whole number, at least 1.";
  const o=DB.phase.find(r=>r!==row&&r._active&&rangeOverlap(phRange(r),phRange(rec)));if(o)return`Range overlaps ${o.phase} (${rangeTxt(phRange(o),"INR")}). Each cart value must fall in one phase (G-15).`;
  if(rec.active&&!(row&&row.active)&&!rec.activation_note)return"Add the approval note before activating a phase (US-310).";

// Reminder engine: Reminder Rule × Working Calendar (simulate() from step 5) for every open case
const ruleSteps=x=>{const m=String(x.step_label||"").match(/^(\d+)\s*(?:\/\s*(\d+))?/);const a=[+x.step_no];if(m){a.push(+m[1]);if(m[2])a.push(+m[2])}return[...new Set(a)]};
const RULE_SKIP=/Sent to market|Globe no\. submitted|Query unanswered|Exception approved/;
function rulesFor(c){const w=whoAt(c);return DB.reminder.filter(x=>x._active&&x.module===c.module&&ruleSteps(x).includes(+c.step)&&!["DAY_BEFORE_EVENT","MONTHLY"].includes(x.frequency)&&!RULE_SKIP.test(x.trigger))
 .map(x=>({x,to:(ruleSteps(x).length>1||!x.recipient_role)?w.task[0]:x.recipient_role})).filter(o=>o.to&&w.task.includes(o.to))}
function runScheduler(from,to){const keys=new Set(DB.notif.map(n=>n.key));let made=0;
 DB.req.filter(isOpen).forEach(c=>rulesFor(c).forEach(({x,to:role})=>{const sim=simulate(x,c.entity,c.entered,"");if(!sim||sim.err)return;
  sim.out.filter(o=>o.d>from&&o.d<=to).forEach(o=>{const isE=o.kind==="Escalation";const rc=isE?x.escalate_to_role:role;if(!rc)return;
   roleHolders(rc,c.entity).forEach(sso=>{const k=[x.rule_id,c._id,c.step,o.d,o.kind,sso].join("|");if(keys.has(k))return;keys.add(k);

function newNo(e,mod){DB.seq=DB.seq||{};const k=mod+"|"+e;DB.seq[k]=(DB.seq[k]||36)+1;const y=today().slice(0,4);return`${mod==="NegBot"?"NB":"AIS"}-${e}-${y}-${String(DB.seq[k]).padStart(5,"0")}`}
function price(e,amt,cur,date){const eur=rateFor(cur,"EUR",date),inr=rateFor(cur,"INR",date);return{eur:eur?amt*eur.rate:null,rate_id:eur?.id||"",inr:inr?amt*inr.rate:null}}
function routeOf(e,stc,eur){const st=DB.sourcing.find(s=>s.entity===e&&s.code===stc);if(!st)return{};if(st.scrap)return{flow:"SCRAP",band:null,st};const b=eur==null?null:bandFor(eur);return{flow:b?.flow||"",band:b,st}}
const STEP_VERB=r=>{const n=stepRow(r.module,r.step)?.name||"";if(r.module==="NegBot")return+r.step===6?["Authorise targets","Targets authorised"]:["Mark step done","Step completed"];
 if(/Approval|Review/i.test(n))return["Approve","Approved"];if(+r.step===18)return["Sign SFO","SFO signed"];if(+r.step===5)return["Submit FSK case","FSK case submitted"];return["Mark step done","Step completed"]};
const canDecline=r=>r.module==="GP"&&/Approval|Review/i.test(stepRow(r.module,r.step)?.name||"");
function moveNext(r,o={}){const p=pathFor(r);let i=p.indexOf(+r.step);const prev=r.step;const by=o.by||me()?.full_name||"AIS";
 for(let g=0;g<60;g++){i++;
  if(i>=p.length){r.status="CLOSED";r.closed=today();r.hist.push({d:today(),t:nowTime(),step:prev,role:"",by:"AIS",action:r.module==="NegBot"?"Results handed over, case closed":"Request closed, copies distributed",note:""});
   if(r.module==="GP")notifyRoles(r,["INITIATOR"],`${r.no} is closed. The contract copy is available in AIS.`,"Request closed");return}
  const n=p[i];if(n===4)continue;const w=whoAt(r,n);
  if(w.via==="system"&&r.module==="GP"){r.hist.push({d:today(),t:nowTime(),step:n,role:"",by:"AIS",action:"Completed by AIS",note:"System step"});continue}
  if(o.form&&w.via==="step"&&w.task.includes("INITIATOR")){r.hist.push({d:today(),t:nowTime(),step:n,role:"INITIATOR",by,action:"Captured in the request form",note:""});continue}
  r.step=n;r.entered=today();delete r.status;alertNewTask(r);
  if(r.module==="GP"&&!w.task.includes("INITIATOR")&&!o.silent)notifyRoles(r,["INITIATOR"],`${r.no} moved to step ${n}, ${stepRow("GP",n)?.name||""}. Now with ${w.task.map(roleName).join(", ")||"AIS"}.`,"Your request moved");
  return}}
function act(id,kind,comment=""){const r=DB.req.find(x=>x._id===id);if(!r)return;const w=whoAt(r);
 if(!w.task.includes(S.role)){toast("This step is not on your Task List.");return}
 const [,past]=STEP_VERB(r);
 r.hist.push({d:today(),t:nowTime(),step:r.step,role:S.role,by:me().full_name,action:kind==="decline"?"Declined":past,note:comment});
 if(kind==="decline"){r.status="DECLINED";r.closed=today();notifyRoles(r,["INITIATOR"],`${r.no} was declined at step ${r.step} by ${roleName(S.role)}. Reason: ${comment}`,"Request declined",true);commit(`Declined ${r.no}`);return}
 if(r.module==="GP"&&+r.step===10){const cat=DB.category.find(c=>c._active&&c.code===r.category);if(cat?.notify_infosec)notifyRoles(r,["INFOSEC"],`IT request ${r.no} was approved by the Cost Center Head. Security review can start. Topic: ${r.topic}. Initiator: ${uName(r.initiator)}. Cost center: ${r.cost_center}.`,"IT request approved",true)}
 moveNext(r);commit(`${past}: ${r.no}`)}
function nudge(id,msg){const r=DB.req.find(x=>x._id===id);const w=whoAt(r);let n=0;
 w.task.forEach(rc=>roleHolders(rc,r.entity).forEach(sso=>{pushNotif({key:`MANUAL|${r._id}|${sso}|${Date.now()}`,user:sso,c:r,kind:"REMINDER",d:today(),t:nowTime(),rule:"MANUAL",title:`Reminder from ${roleName(S.role)}`,text:msg?`${r.no}: ${msg}`:""});n++}));
 r.hist.push({d:today(),t:nowTime(),step:r.step,role:S.role,by:me().full_name,action:"Sent a manual reminder",note:msg});commit(n?`Reminder sent to ${w.task.map(roleName).join(", ")}`:"No one holds this step")}

/* ---------- 7. Guide: glossary and site map ---------- */
const GLOSSARY=[
 ["AIS","Appropriate IT Solution with AI. The SAVWIPL procurement workspace that carries a request from the initiator to the signed contract.","Platform"],
 ["SAVWIPL","Skoda Auto Volkswagen India Private Limited, the organisation that runs AIS.","Organisation"],
 ["Legal entity (E1, E2)","A company within SAVWIPL with its own users, cost centers, calendars and rules. Entity 1 uses the FSK Portal; Entity 2 does not.","Organisation"],
 ["GP Process","General Procurement: the end-to-end flow from a purchase request through sourcing, negotiation and approval to the contract.","Module"],
 ["FSK Portal","The upstream gate where investment topics are presented to the steering committee and approved before procurement starts. Used only where the entity has FSK switched on.","Module"],
 ["FSK","The steering-committee approval for investment topics. An approved FSK number flows into the procurement request.","Process"],
 ["Steuerkreis","The steering committee that reviews and approves FSK topics.","Process"],
 ["Negotiation Bot","The AI assistant that negotiates small shopping carts with suppliers inside the guardrails and time windows Admin sets.","Module"],
 ["Shopping cart","The purchase document raised in the ERP. AIS tracks it by its number and uses it to start a Negotiation Bot case.","Document"],
 ["Globe enquiry","The sourcing event in the Globe system, identified by its Globe number. The buyer sends the RFQ to the market through it.","Document"],
 ["RFQ","Request for quotation: the documents the initiator uploads and the buyer sends to suppliers.","Document"],
 ["SFO","Sourcing Frame Order: the sourcing decision document the buyer prepares once offers are evaluated, signed by the approvers.","Document"],
 ["BA","Buyer Administration: the procurement section that reviews requests, runs sourcing and negotiates.","Organisation"],
 ["BZI / IIC","Investment approvals required before a request on the investment sourcing type can go ahead.","Process"],
 ["WBS number","Work breakdown structure element that carries the investment budget in the ERP.","Document"],
 ["Sourcing type","How the purchase is funded and processed, for example Investment, Revenue or Scrap. It decides which prerequisites apply.","Master"],
 ["Budget band","The value range a request falls into after conversion to EUR. It decides the High or Low budget flow and who approves.","Master"],
 ["High budget flow","The full GP route for requests at or above EUR 50,000: BA review, Globe enquiry, offers, SFO, negotiation and committee or head approvals.","Process"],
 ["Low budget flow","The shorter GP route for requests below EUR 50,000.","Process"],
 ["Scrap flow","The route for selling scrap: the steps run in reverse, with the buyer processing the scrap contract.","Process"],

 ["Process step","One numbered step of a flow with its owner and standard turnaround time. GP has 41 steps and the Negotiation Bot 10.","Master"],
 ["Step visibility","Decides, per step and role, whether the step lands in that role's Task List (they act) or Status Queue (they follow).","Master"],

 ["Email outbox","The list of every email AIS would send you. In this prototype nothing leaves the browser.","Notification"],
 ["SSO","Single sign-on with the corporate identity. AIS has no separate password.","Access"],

 Object.entries(ST_LABEL).forEach(([c,l])=>{if(!g.some(x=>x.t===l))g.push({t:l,d:ST_DESC[c]||"Case status shown on the chip next to the case number.",k:"Status"})});
 return g.sort((a,b)=>a.t.localeCompare(b.t))}
const ST_DESC={DRAFT:"Request saved by the initiator but not yet submitted.",SUBMITTED:"Request submitted and waiting for the cost center approval.",QUERY:"An approver or buyer has asked a question; the case waits for the answer.",IN_REVIEW_BA:"Section Head BA and the buyer are reviewing the request.",IN_SOURCING:"The buyer is preparing or running the Globe enquiry.",OFFERS_RECEIVED:"Supplier offers are in and being evaluated.",SFO_APPROVED:"The Sourcing Frame Order has been signed.",IN_NEGOTIATION:"The buyer is negotiating with the shortlisted suppliers.",IN_SOURCING_APPROVAL:"The sourcing decision is with the approvers or the committee.",SOURCING_APPROVED:"The sourcing decision is approved; the contract is being prepared.",CONTRACT_IN_APPROVAL:"The contract is with its approvers for signature.",CONTRACT_APPROVED:"The contract is approved and the case is completing.",CLOSED:"Case complete. No further action.",DECLINED:"An approver declined the request with a comment.",FSK_SUBMITTED:"FSK topic submitted and waiting for the coordinator.",READY_FOR_FORUM:"FSK presentation ready for the steering committee.",SCHEDULED:"FSK topic placed on the steering committee agenda.",SELECTED:"Shopping cart picked up for the Negotiation Bot.",AWAITING_RPA:"Waiting for the automated extraction to fetch the cart details.",COMPARISON_READY:"Price comparison prepared for the negotiation.",AWAITING_BUYER:"The buyer must confirm suppliers and the target price before the bot can start.",INVITATIONS_SENT:"Suppliers have been invited to the bot negotiation.",NEGOTIATING:"The Negotiation Bot is negotiating with suppliers.",ESCALATED:"The bot handed the case to the Buyer Supervisor.",COMPLETED:"Bot negotiation finished and the result handed back to the buyer.",EXCLUDED:"Cart excluded from bot negotiation.",FAILED:"Bot negotiation ended without an agreement."};
function siteMap(){const a=access(S.role,S.entity);const adm=a.mods.find(m=>m[0]==="admin");const MD={gp:"Your GP Process steps and cases",fsk:"FSK topics, agenda and approvals",nb:"Negotiation Bot carts and runs",rep:"Snapshot of cases and timing",admin:"Master data setup"};
 const S1=[["Work",[["nav","home","Home","What needs you today and your end-of-day list"],["nav","tasks","My tasks","Task List: cases where it is your turn"],["nav","queue",OVERSIGHT.includes(S.role)?"All open cases":"Watching","Status Queue: cases you follow"],["nav","profile","My profile","Your details, cost center and roles"]]]];
 const mods=a.mods.filter(m=>m[0]!=="admin");if(mods.length)S1.push(["Modules",mods.map(([k,l])=>["nav",k,l,MD[k]||""])]);
 const TD={overview:"Readiness of every master and what the client must supply",health:"Record counts, dependencies and open client items",assume:"Working assumptions to confirm with the client",access:"What each role sees and can do",tester:"Check the route for a sourcing type and value",aptest:"Approver chain and forum for an object and amount",audit:"Every change made to master data"};
 if(adm){S1.push(["Setup · Admin",[...RAIL_TOP.map(([v,l])=>["admin",v,l,TD[v]||""])],RAIL.map(([n,h,t])=>[h,MASTERS.filter(t).map(m=>["admin",m.id,m.name,m.purpose||""])])])}
 S1.push(["Tools",[["pal","","Search","Find a case, page or master · Ctrl K"],["open","notif","Notifications","In-app alerts and the email outbox"],["open","ask","Ask AIS","Ask about your cases in plain words"],...(S.role==="INITIATOR"?[["open","new","Start a request","GP steps 1 and 2"]]:[]),...(DEMO.enabled?[["open","demo","Prototype controls","Clock, persona and demo data"]]:[])]]);
 return S1}
let GD={tab:"gloss",q:""};
const hl=(s,q)=>{const t=esc(s);if(!q)return t;const i=s.toLowerCase().indexOf(q);return i<0?t:esc(s.slice(0,i))+"<mark>"+esc(s.slice(i,i+q.length))+"</mark>"+esc(s.slice(i+q.length))};
function guideBody(){const q=GD.q.trim().toLowerCase();
 const rank=x=>{const t=x.t.toLowerCase();return t===q?0:t.startsWith(q)?1:t.includes(q)?2:3};
 const G=glossaryAll().filter(x=>!q||(x.t+" "+x.d+" "+x.k).toLowerCase().includes(q)).sort((a,b)=>q?rank(a)-rank(b)||a.t.localeCompare(b.t):0);
 const SM=siteMap();const smHit=it=>!q||(it[2]+" "+it[3]).toLowerCase().includes(q);
 let smN=0;SM.forEach(([,L,sub])=>{smN+=L.filter(smHit).length;(sub||[]).forEach(([h,L2])=>smN+=L2.filter(it=>smHit(it)||h.toLowerCase().includes(q)).length)});
 const tabs=`<div class="gd-tabs" role="tablist"><button role="tab" data-gt="gloss" aria-pressed="${GD.tab==="gloss"}">Glossary <b>${G.length}</b></button><button role="tab" data-gt="map" aria-pressed="${GD.tab==="map"}">Site map <b>${smN}</b></button></div>`;
 let body="";
 if(GD.tab==="gloss"){const letters=[...new Set(G.map(x=>x.t[0].toUpperCase()))];
  let last="";body=G.length?`${q?"":`<div class="gd-alpha">${"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(L=>`<button data-gl="${L}" ${letters.includes(L)?"":"disabled"}>${L}</button>`).join("")}</div>`}<ul class="gl">${G.map(x=>{const L=x.t[0].toUpperCase();const hd=!q&&L!==last?`<li class="gl-l" id="gl-${L}" style="border:0;padding:0">${L}</li>`:"";last=L;
   return hd+`<li><div class="gt"><b>${hl(x.t,q)}</b><span class="gk">${esc(x.k)}</span></div><div class="gd">${hl(x.d,q)}</div>${x.go&&access(S.role,S.entity).mods.some(m=>m[0]==="admin")?`<div class="gl-go"><button class="linkbtn" data-sm="admin:${x.go}">Open the ${esc(x.t)} master</button></div>`:""}</li>`}).join("")}</ul>`:emptyHTML("No term matches",`Try another word, or search the site map.`,"search")}
 else{const item=it=>`<li><button data-sm="${it[0]}:${it[1]}" class="${(it[0]==="nav"&&S.module===it[1])||(it[0]==="admin"&&S.module==="admin"&&S.view===it[1])?"here":""}"><b>${hl(it[2],q)}</b>${it[3]?`<span>${hl(it[3],q)}</span>`:""}</button></li>`;
  const secs=SM.map(([h,L,sub])=>{const a=L.filter(smHit);const s2=(sub||[]).map(([gh,L2])=>[gh,L2.filter(it=>smHit(it)||gh.toLowerCase().includes(q))]).filter(x=>x[1].length);
   return a.length||s2.length?`<li><div class="sm-h">${esc(h)}</div><ul>${a.map(item).join("")}${s2.map(([gh,L2])=>`<li><div class="grp">${esc(gh)}</div><ul>${L2.map(item).join("")}</ul></li>`).join("")}</ul></li>`:""}).join("");
  body=secs?`<ul class="sm">${secs}</ul>`:emptyHTML("No page matches","Try another word, or search the glossary.","search");
  if(!q)body+=`<h3 class="qh" style="margin-top:6px">Keyboard shortcuts</h3><div class="keys"><kbd>Ctrl K</kbd><span>Search cases, pages and masters</span><kbd>/</kbd><span>Search</span><kbd>?</kbd><span>Open this guide</span><kbd>↑ ↓</kbd><span>Move through lists and tables</span><kbd>Enter</kbd><span>Open the selected row</span><kbd>Esc</kbd><span>Close a panel</span></div>`}
 return{tabs,body}}
function openGuide(q){if(typeof q==="string"){GD.q=q;GD.tab="gloss"}const {tabs,body}=guideBody();
 openDrawer("guide",drHead(`${ico("book")}<b>Guide</b>`)+`<div class="gd-s"><label class="sbox">${ico("search")}<input type="search" id="gdQ" placeholder="Search terms and pages" value="${esc(GD.q)}" aria-label="Search the guide" autofocus></label></div><div id="gdTabs">${tabs}</div><div class="dr-b" id="gdB">${body}</div>`);bindGuide()}
function refreshGuide(){const {tabs,body}=guideBody();$("#gdTabs").innerHTML=tabs;$("#gdB").innerHTML=body;bindGuide(true)}
function bindGuide(soft){const q=$("#gdQ");if(!soft)q.oninput=e=>{GD.q=e.target.value;refreshGuide()};
 $$("[data-gt]").forEach(b=>b.onclick=()=>{GD.tab=b.dataset.gt;refreshGuide()});
 $$("[data-gl]").forEach(b=>b.onclick=()=>$(`#gl-${b.dataset.gl}`)?.scrollIntoView({block:"start",behavior:"smooth"}));
 $$("#gdB [data-sm]").forEach(b=>b.onclick=()=>{const [k,v]=b.dataset.sm.split(":");closeDrawer(true);
  if(k==="nav")go(v);else if(k==="admin"){S.view=v;S.q="";S.sort=null;go("admin")}else if(k==="open")openPanel(v);else if(k==="pal")openPal()})}
/* Guide in the top bar, palette, Ask AIS and the ? key */
(function(){const t=$(".tb-r");if(t&&!$("#guideBtn"))t.insertAdjacentHTML("afterbegin",`<button class="iconbtn" id="guideBtn" data-open="guide" aria-label="Guide: glossary and site map" title="Guide: glossary and site map (?)">${ico("book")}<span class="lbl">Guide</span></button>`);
 const env=$(".envb");if(env)env.title="Prototype environment";const db=$("#demoBtn");if(db)db.title="Prototype controls: persona, clock and demo data"})();
document.addEventListener("keydown",e=>{if(!S.user)return;const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||"");if(e.key==="?"&&!typing&&!$("#pal").open){e.preventDefault();openGuide()}});
function glossHits(q){q=q.toLowerCase().trim();if(q.length<2)return[];return glossaryAll().filter(x=>x.t.toLowerCase().includes(q)).slice(0,4)}

/* ---------- 8. Prototype controls: requirement references toggle ---------- */
function refsToggleHTML(){return`<div class="blk"><h3>Delivery team</h3><label class="switch" style="color:var(--text)"><input type="checkbox" id="ckRefs" ${DEMO.refs?"checked":""}><span class="tr"></span>Show requirement references</label><p class="fine">Shows story, rule and source references for traceability reviews. Keep it off for client demos.</p></div>`}

/* ---------- 9. Wiring ---------- */
(function(){const dx=$("#dlg .dlg-h .iconbtn");if(dx)dx.innerHTML=ico("x")})();
function askAnswer(q){const m=q.trim().match(/^(?:what|who)\s+(?:is|are|does)\s+(?:an?\s+|the\s+)?(.+?)(?:\s+mean)?\s*\??$/i)||q.trim().match(/^(?:define|meaning of|explain)\s+(.+?)\s*\??$/i);
 if(m){const term=m[1].toLowerCase().replace(/[?.!]+$/,"");const G=glossaryAll();const x=G.find(g=>g.t.toLowerCase()===term)||G.find(g=>g.t.toLowerCase().split(/[\s(),/]+/).includes(term))||G.find(g=>g.t.toLowerCase().startsWith(term));
  if(x)return`<b>${esc(x.t)}</b> <span class="sub small">${esc(x.k)}</span><br>${esc(x.d)}<div style="margin-top:6px"><button class="linkbtn" data-gq="${esc(x.t)}">Open in the guide</button></div>`}
 return askAnswerBase(q)}
document.addEventListener("click",e=>{const b=e.target.closest("[data-gq]");if(b){e.preventDefault();openGuide(b.dataset.gq)}});

if(!DB.req||!DB.notif){seedTx();save()}
if(S.user&&ensureSession())renderShell();else render0();bumpIdle();
</script>
