name: Keep the Negotiation Desk awake

# Render's free plan puts a service to sleep after about 15 minutes without traffic.
# This pings the API and the web app every 10 minutes on working days, 08:00 to 20:00 India time
# (GitHub schedules run in UTC). A sleeping service takes up to a minute to answer, so each call waits long.
on:
  schedule:
    - cron: "*/10 2-14 * * 1-5"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API
        run: curl -fsS --retry 3 --retry-delay 15 --max-time 100 https://negotiation-api.onrender.com/api/health
      - name: Ping the web app
        run: curl -fsS --retry 3 --retry-delay 15 --max-time 100 -o /dev/null https://negotiation-web.onrender.com/
